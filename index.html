<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DunDun — Task Management</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <span class="drum-icon" aria-hidden="true">🥁</span>
        </div>
        <div class="brand-text">
          <h1 class="brand-title">DunDun<span>!</span></h1>
          <p class="brand-tagline">Consider it done.</p>
        </div>
      </div>
    </header>

    <!-- Stats Dashboard -->
    <section class="stats-card" aria-label="Task Summary">
      <div class="stats-grid">
        <div class="stat-item total">
          <span class="stat-label">Total</span>
          <span class="stat-number" id="stat-total">0</span>
        </div>
        <div class="stat-item pending">
          <span class="stat-label">Pending</span>
          <span class="stat-number" id="stat-pending">0</span>
        </div>
        <div class="stat-item completed">
          <span class="stat-label">Completed</span>
          <span class="stat-number" id="stat-completed">0</span>
        </div>
      </div>
      <div class="progress-bar-container" title="Completion Progress">
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progress-fill" style="width: 0%;"></div>
        </div>
        <span class="progress-text" id="progress-text">0% DunDun</span>
      </div>
    </section>

    <!-- Add Task Card -->
    <section class="card add-task-card" aria-label="Add New Task">
      <h2 class="card-title">Add a Task</h2>
      <form id="add-task-form" autocomplete="off">
        <div class="form-group">
          <label for="task-title" class="sr-only">Task Title</label>
          <div class="input-with-icon">
            <input 
              type="text" 
              id="task-title" 
              placeholder="What needs to get DunDun?..." 
              required
              maxlength="150"
            >
          </div>
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label for="task-due-date" class="form-label">Due Date</label>
            <input type="date" id="task-due-date" class="form-control">
          </div>

          <div class="form-group flex-1">
            <label for="task-priority" class="form-label">Priority</label>
            <select id="task-priority" class="form-control">
              <option value="High">🔥 High</option>
              <option value="Medium" selected>⚡ Medium</option>
              <option value="Low">🌱 Low</option>
            </select>
          </div>

          <div class="form-group flex-1">
            <label for="task-category" class="form-label">Category</label>
            <select id="task-category" class="form-control">
              <option value="Work">💼 Work</option>
              <option value="Personal" selected>👤 Personal</option>
              <option value="School">📚 School</option>
              <option value="Others">📌 Others</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btn-add-task">
          <span class="btn-icon">＋</span> Add to DunDun
        </button>
      </form>
    </section>

    <!-- Search & Filters -->
    <section class="controls-section" aria-label="Task Filters and Search">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input 
          type="search" 
          id="search-input" 
          placeholder="Search tasks by title..." 
          aria-label="Search tasks by title"
        >
        <button type="button" id="search-clear-btn" class="search-clear-btn" aria-label="Clear search" hidden>×</button>
      </div>

      <div class="filter-tabs" role="tablist" aria-label="Task status filters">
        <button type="button" class="filter-tab active" data-filter="all" role="tab" aria-selected="true">
          All <span class="tab-badge" id="filter-count-all">0</span>
        </button>
        <button type="button" class="filter-tab" data-filter="pending" role="tab" aria-selected="false">
          Pending <span class="tab-badge" id="filter-count-pending">0</span>
        </button>
        <button type="button" class="filter-tab" data-filter="completed" role="tab" aria-selected="false">
          Completed <span class="tab-badge" id="filter-count-completed">0</span>
        </button>
      </div>

      <!-- Category Filter Pills -->
      <div class="category-filters-container">
        <div class="category-pills" role="group" aria-label="Filter by category">
          <button type="button" class="category-pill active" data-category="all">
            All <span class="cat-pill-count" id="cat-count-all">0</span>
          </button>
          <button type="button" class="category-pill" data-category="Work">
            💼 Work <span class="cat-pill-count" id="cat-count-work">0</span>
          </button>
          <button type="button" class="category-pill" data-category="Personal">
            👤 Personal <span class="cat-pill-count" id="cat-count-personal">0</span>
          </button>
          <button type="button" class="category-pill" data-category="School">
            📚 School <span class="cat-pill-count" id="cat-count-school">0</span>
          </button>
          <button type="button" class="category-pill" data-category="Others">
            📌 Others <span class="cat-pill-count" id="cat-count-others">0</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Task List Section -->
    <main class="task-list-section" aria-label="Tasks List">
      <div id="tasks-container" class="tasks-container">
        <!-- Rendered by JavaScript -->
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>DunDun — Stay organized, knock things out! ✨</p>
    </footer>
  </div>

  <!-- Edit Task Modal -->
  <div class="modal-overlay" id="edit-modal" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="edit-modal-title" class="modal-title">✏️ Edit Task</h3>
        <button type="button" class="modal-close-btn" id="edit-modal-close" aria-label="Close edit modal">×</button>
      </div>
      <form id="edit-task-form">
        <input type="hidden" id="edit-task-id">
        <div class="form-group">
          <label for="edit-task-title" class="form-label">Task Title</label>
          <input 
            type="text" 
            id="edit-task-title" 
            class="form-control" 
            required 
            maxlength="150"
          >
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label for="edit-task-due-date" class="form-label">Due Date</label>
            <input type="date" id="edit-task-due-date" class="form-control">
          </div>

          <div class="form-group flex-1">
            <label for="edit-task-priority" class="form-label">Priority</label>
            <select id="edit-task-priority" class="form-control">
              <option value="High">🔥 High</option>
              <option value="Medium">⚡ Medium</option>
              <option value="Low">🌱 Low</option>
            </select>
          </div>

          <div class="form-group flex-1">
            <label for="edit-task-category" class="form-label">Category</label>
            <select id="edit-task-category" class="form-control">
              <option value="Work">💼 Work</option>
              <option value="Personal">👤 Personal</option>
              <option value="School">📚 School</option>
              <option value="Others">📌 Others</option>
            </select>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="edit-modal-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="edit-modal-save">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="delete-modal" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title" hidden>
    <div class="modal-card delete-card">
      <div class="modal-header">
        <h3 id="delete-modal-title" class="modal-title">🗑️ Delete Task?</h3>
        <button type="button" class="modal-close-btn" id="delete-modal-close" aria-label="Close delete modal">×</button>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to delete this task?</p>
        <p class="delete-task-preview" id="delete-task-preview"></p>
        <p class="delete-warning-sub">This action cannot be undone.</p>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="delete-modal-cancel">Keep Task</button>
        <button type="button" class="btn btn-danger" id="delete-modal-confirm">Delete Task</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
